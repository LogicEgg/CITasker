<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classes</title>
</head>
<body>
    <h1>Term {{num}} Courses</h1>
    {% for class in data %}
        <div>
            <h2><a href="{{ url_for('class_page', id=class.id) }}">{{ class.name }}</a></h2>
        </div>
    {% endfor %}
</body>
</html>

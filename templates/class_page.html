{% extends "base.html" %}

{% block content%}
<h1>{{course.name}}</h1>

<form action="{{ url_for('api.add', id=course.id) }}" method="POST">
        <input type="hidden" name="id" value="{{ course.id }}" required>
        <div class="mb-3">
            <label for="event" class="form-label">Event:</label>
            <input type="text" class="form-control" name="event" placeholder="Description" required>
        </div>
        <div class="mb-3">
            <label for="deadline" class="form-label">Deadline:</label>
            <input type="date" class="form-control" name="deadline" placeholder="Deadline (YYYY-MM-DD, HH:MM)" required>
        </div>
        <button type="submit" class="btn btn-primary">Add Event</button>
    </div>
</form>

<div class="container-sm">
    {% for i in events %}
    <h3>{{i.description}}</h3>
    <p>Due: {{i.deadline.strftime('%A, %b %Y, %I:%M%p %Z')}}</p>
    {% endfor %}
</div>
{% endblock %}

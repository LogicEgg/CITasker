{% extends "base.html" %}

{% block content%}
<div class="container mt-2">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb breadcrumb-chevron">
            <!-- <li class="breadcrumb-item"><a href="{{ url_for('homepage') }}">Home</a></li> -->
            <li class="breadcrumb-item"><a href="{{ url_for('term_page') }}">Terms</a></li>
            <li class="breadcrumb-item"><a href="{{ url_for('term_classes', num=course.term) }}">Term {{course.term}}</a></li>
            <li class="breadcrumb-item active" aria-current="page">{{course.name}}</li>
        </ol>
    </nav>

    <h1>{{course.name}}</h1>

    <form action="{{ url_for('api.add', id=course.id) }}" method="POST">
        <input type="hidden" name="id" value="{{ course.id }}" required>
        <div class="mb-3">
            <label for="event" class="form-label">Event:</label>
            <input type="text" class="form-control" name="event" placeholder="Description" required>
        </div>
        <div class="mb-3">
            <label for="deadline" class="form-label">Deadline:</label>
            <input type="date" class="form-control" name="deadline" placeholder="Deadline (YYYY-MM-DD, HH:MM)" required>
        </div>
        <button type="submit" class="btn btn-primary">Add Event</button>
    </form>

    <div class="list-group list-group-flush">
        {% for i in events %}
        <div class="list-group-item flex-fill">
            <h3 class="mb-4 mt-2">{{i.description}}</h3>
            <div class="d-flex justify-content-between">
                <p>Due: {{i.deadline.strftime('%A %d, %b %Y, %I:%M%p %Z')}}</p>
                <form action="{{ url_for('api.delete', eventid=i.id) }}" method="POST">
                    <div class="d-grid gap-2 d-md-block">
                        <button class="btn btn-secondary" type="button" data-bs-toggle="collapse"
                            data-bs-target="#{{i.id}}" aria-expanded="false" aria-controls="{{i.id}}">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                                class="bi bi-pencil-fill" viewBox="0 0 16 16">
                                <path
                                    d="M12.854.146a.5.5 0 0 0-.707 0L10.5 1.793 14.207 5.5l1.647-1.646a.5.5 0 0 0 0-.708zm.646 6.061L9.793 2.5 3.293 9H3.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.207zm-7.468 7.468A.5.5 0 0 1 6 13.5V13h-.5a.5.5 0 0 1-.5-.5V12h-.5a.5.5 0 0 1-.5-.5V11h-.5a.5.5 0 0 1-.5-.5V10h-.5a.5.5 0 0 1-.175-.032l-.179.178a.5.5 0 0 0-.11.168l-2 5a.5.5 0 0 0 .65.65l5-2a.5.5 0 0 0 .168-.11z" />
                            </svg>
                        </button>
                        <button class="btn btn-danger" type="submit">
                            <input type="hidden" name="_method" value="DELETE">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                                class="bi bi-trash-fill" viewBox="0 0 16 16">
                                <path
                                    d="M2.5 1a1 1 0 0 0-1 1v1a1 1 0 0 0 1 1H3v9a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V4h.5a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H10a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1zm3 4a.5.5 0 0 1 .5.5v7a.5.5 0 0 1-1 0v-7a.5.5 0 0 1 .5-.5M8 5a.5.5 0 0 1 .5.5v7a.5.5 0 0 1-1 0v-7A.5.5 0 0 1 8 5m3 .5v7a.5.5 0 0 1-1 0v-7a.5.5 0 0 1 1 0" />
                            </svg>
                        </button>
                    </div>
                </form>
            </div>
            <div class="collapse mt-1" id="{{ i.id }}">
                <div class="card card-body">
                    <form action="{{ url_for('api.edit', eventid=i.id) }}" method="POST">
                        <input type="hidden" name="_method" value="PUT">
                        <input type="hidden" name="id" value="{{ i.id }}" required>
                        <div class="mb-3">
                            <label for="event" class="form-label">Event:</label>
                            <input type="text" class="form-control" name="event" value="{{ i.description }}" placeholder="Updated Description">
                        </div>
                        <div class="mb-3">
                            <label for="deadline" class="form-label">Deadline:</label>
                            <input type="date" class="form-control" name="deadline"
                                placeholder="Updated Deadline (YYYY-MM-DD, HH:MM)">
                        </div>
                        <button type="submit" class="btn btn-primary">Edit Event</button>
                    </form>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}

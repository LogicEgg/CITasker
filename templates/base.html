<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>CITasker</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous"/>
        <style>
            .h-300 {
                height: 300px;
            }
            .object-fit-cover {
                object-fit: cover;
            }
            .hover-shadow:hover, .hover-shadow:active {
                box-shadow: 0 .5rem 1rem rgba(13, 110, 253, 0.60)!important;
                transform: translateY(-2px);
                transition: all .2s ease-in-out;
            }
            .transition {
                transition: all .2s ease-in-out;
            }
            /* Add touch feedback */
            @media (hover: none) {
                .hover-shadow:active {
                    box-shadow: 0 .5rem 1rem rgba(13, 110, 253, 0.60)!important;
                    transform: translateY(-2px);
                }
                .btn:active {
                    transform: scale(0.98);
                }
            }
            .calendar {
                font-size: 0.9rem;
            }
            .calendar-day {
                aspect-ratio: 1;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                position: relative;
                padding: 0.25rem;
            }
            .calendar-day-header {
                font-weight: 600;
                color: #6c757d;
            }
            .calendar-day:hover {
                background-color: rgba(13, 110, 253, 0.1);
                border-radius: 0.25rem;
            }
            .calendar-dots {
                display: flex;
                gap: 2px;
                justify-content: center;
                margin-bottom: 2px;
            }
            .calendar-dots .badge {
                padding: 0;
                margin: 0 1px;
            }
            .list-group-item-primary:hover .task-text {
                color: white !important;
            }
            .list-group-item-primary:hover {
                background-color: #0b5ed7 !important;
                border-color: #0a58ca !important;
            }
        </style>
    </head>

    <body class="bg-body-tertiary">
        <div class="container sticky-top bg-body">
            <nav class="navbar navbar-expand-lg border-body border-bottom">
                <div class="container-fluid">
                    <a class="navbar-brand d-flex align-items-center" href="{{ url_for('homepage')}}">
                        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="CITasker Logo" height="40" class="me-2" style="object-fit: contain;">
                    </a>
                    <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                        <div class="navbar-nav">
                            <a class="nav-link text-body-emphasis" href="{{ url_for('term_page')}}">Terms</a>
                            <!-- <a
                                class="nav-link {% if request.endpoint == 'wip1' %}active text-dark border-bottom border-dark{% endif %}"
                                href="#"
                                >WIP</a
                            >
                            <a
                                class="nav-link {% if request.endpoint == 'wip2' %}active text-dark border-bottom border-dark{% endif %}"
                                href="#"
                                >WIP</a
                            > -->
                        </div>
                    </div>
                </div>
            </nav>
        </div>
        <main class="container py-4">{% block content %} {% endblock %}</main>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
    </body>
</html>

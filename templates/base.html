<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>CITasker</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous"/>
        <style>
            .h-300 {
                height: 300px;
            }
            .object-fit-cover {
                object-fit: cover;
            }
            .navbar-brand img {
                height: 40px;
                width: auto;
            }
        </style>
    </head>

    <body>
        <div class="container">
            <nav
                class="navbar navbar-expand-lg border-body border-bottom">
                <div class="container-fluid">
                    <a class="navbar-brand" href="{{ url_for('homepage')}}">
                        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="CITasker Logo">
                    </a>
                    <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                        <div class="navbar-nav">
                            <a class="nav-link" href="{{ url_for('term_page')}}">Terms</a>
                        </div>
                        <div class="navbar-nav ms-auto">
                            {% if current_user.uname %}
                            <a class="nav-link" href="{{ url_for('auth.logout' )}}">Log Out</a>
                            {% else %}
                            <a class="nav-link" href="{{ url_for('auth.login' )}}">Log In</a>
                            <a class="nav-link" href="{{ url_for('auth.register' )}}">Register</a>
                            {% endif %}
                        </div>
                    </div>
                </div>
            </nav>
        </div>
        <main class="container">{% block content %} {% endblock %}</main>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
    </body>
</html>
